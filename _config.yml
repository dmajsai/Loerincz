# Jekyll configuration for loerinczengineering.de
#
# GitHub Pages already ran Jekyll on this repo with defaults, so enabling it
# properly adds no new build tooling. index.html, about.html and 404.html carry
# no YAML front matter, which means Jekyll copies them through untouched. Only
# the blog uses layouts.

title: Loerincz Engineering
description: >-
  Structural engineering practice in Germany: structural analysis, design and
  static calculations for railway bridges, steel and industrial plant
  structures, and buildings.
url: "https://loerinczengineering.de"
baseurl: ""
lang: en

# Clean article URLs, e.g. /blog/composite-steel-concrete-rail-bridge/
permalink: /blog/:title/

plugins:
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: /blog/feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      cluster: general

# Set once you have the token from Search Console. Left empty so no tag renders.
google_site_verification: ""

# Cloudflare Web Analytics beacon token. Cookieless, so no consent banner is
# required. Left empty so no third-party script loads until you supply it.
cloudflare_analytics_token: ""

# Project references: /projects/ and its structured data list only entries up
# to this year. Newer entries stay in _data/references.yml but are not
# published, and their images are excluded below. To show them again, revert
# the commit "Hide the 2026 project references" (it also restores the
# homepage cards), or raise this year, delete the six images/references lines
# under exclude, and update the titles that name the year range.
references_until: 2024

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - README.md
  - .DS_Store
  # Hidden 2026 project references (see references_until above).
  - images/references/cologne-steel-trough-bridge
  - images/references/stuttgart-21-integral-crossing-structures
  - images/references/eddersheim-pedestrian-overpass
  - images/references/geretshausen-pedestrian-overpass
  - images/references/neustadt-filler-beam-bridges
  - images/references/bingen-platform-refurbishment
