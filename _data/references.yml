- id: industrial-pipe-racks-strengthening
  year: 2024
  sector: industrial
  title: Pipe racks for pipeline construction
  client: Triplan
  services: [Structural analysis, Strengthening]
  summary: >-
    Check of steel pipe racks under new pipeline loads, using second-order frame
    analysis. With local strengthening (an HEA 120 with a welded coped IPE 120
    beneath it, and a welded-in HEA 100) the maximum utilisation of the steel
    beams is 80 percent.
  images:
    - {file: industrial-pipe-racks-strengthening-1, src: 43, alt: "Frame analysis of the pipe rack showing the strengthened members"}

