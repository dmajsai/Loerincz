- id: neustadt-filler-beam-bridges
  year: 2026
  sector: railway
  title: Filler beam railway bridges (WiB)
  location: Neustadt
  client: DB
  services: [Structural analysis, Structural design]
  summary: >-
    Railway bridges built as filler beam decks (Walzträger in Beton): rolled
    steel beams encased in reinforced concrete. The system gives a shallow,
    stiff deck for short spans where construction depth under the track is
    limited.
