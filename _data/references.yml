# Project references 2019-2026, rendered on /projects/ and summarised on the
# homepage. Source: "Lörincz structural design reference 2023-2024-2025-2026"
# (Word document, Nov 2026).
#
# Fields
#   id        anchor on /projects/ and the image file prefix
#   year      as given in the reference document
#   sector    railway | industrial | buildings | hydraulic (drives the filter chips)
#   client    as named in the reference document; omit when not stated
#   images    file = images/references/<file>.webp (+ <file>-thumb.webp)
#             src  = image number inside the Word file (word/media/imageN.png),
#                    only used to regenerate the WebP files
#   case_study  optional link to a blog case study on the same project
#
# Writing rules for this file: plain English, no dashes as sentence breaks,
# facts from the reference document and its drawings only.

- id: cologne-steel-trough-bridge
  year: 2026
  sector: railway
  title: Steel trough bridge, 36 m span
  location: Cologne
  services: [Structural analysis, Steel construction]
  summary: >-
    Single-track railway bridge with a steel trough superstructure spanning 36 m.
    The superstructure carries a 5 m high noise barrier and an escape walkway,
    with a torsion beam along the trough edge, and rests on reinforced concrete
    columns of 1.30 m diameter.
  images:
    - {file: cologne-steel-trough-bridge-1, src: 53, alt: "FE model of the steel trough superstructure with support reactions"}
    - {file: cologne-steel-trough-bridge-2, src: 54, alt: "Cross-section of the steel trough bridge with noise barrier, escape walkway and concrete column"}
    - {file: cologne-steel-trough-bridge-3, src: 55, alt: "General arrangement plan of the steel trough bridge"}

- id: stuttgart-21-integral-crossing-structures
  year: 2026
  sector: railway
  title: Integral crossing structures, Stuttgart 21
  location: Stuttgart
  services: [Structural analysis, Structural design]
  summary: >-
    Integral railway crossing structures for the Stuttgart 21 rail project.
    Integral bridges have no bearings or expansion joints: the superstructure is
    cast monolithically with the substructure, so restraint from temperature,
    shrinkage and soil interaction has to be carried through the frame.
  images:
    - {file: stuttgart-21-integral-crossing-structures-1, src: 52, alt: "Longitudinal section and track plan of the integral crossing structures"}

